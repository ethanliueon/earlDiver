<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog mockup</title>
<!-- A mockup of the catalog on the cabin computer (docs/SHOP_PLAN.md). Not used by the game.
     Open it from the game's server: /docs/catalog_mockup.html?home, ?cat or ?item. -->
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --navy: #23364c; --navy-lo: #182636; --page: #f3efe4; --ink: #2a2620; --muted: #6e675a; --rule: #d8d0bd; --link: #1f4f86; --pic: #b9c8cf; --good: #2f6b3a; --bad: #8a3a2a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(ellipse at 50% 40%, #3a2a1a, #120c06 75%); display: grid; place-items: center; font-family: "EB Garamond", Georgia, serif; color: var(--ink); }
  /* the monitor: a beige bezel, the glass curving a little at its edges */
  .bezel { width: min(1240px, 100vw - 24px); aspect-ratio: 16 / 9.2; padding: 22px 26px 34px; border-radius: 26px; background: linear-gradient(180deg, #ddd3b6, #c3b792 70%, #a99d78); box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.4), inset 0 -3px 0 rgba(0,0,0,0.2); position: relative; }
  .bezel::after { content: ''; position: absolute; left: 50%; bottom: 11px; width: 7px; height: 7px; border-radius: 50%; background: #6ad08a; box-shadow: 0 0 6px #6ad08a; transform: translateX(-50%); }
  .glass { position: relative; height: 100%; border-radius: 14px; overflow: hidden; background: var(--page); box-shadow: inset 0 0 0 3px #5e553f; }
  .glass::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 14px;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.028) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(20,16,8,0.22) 100%); }
  header { display: flex; align-items: baseline; gap: 18px; padding: 12px 22px 10px; background: linear-gradient(180deg, var(--navy), var(--navy-lo)); color: #efe6cf; }
  header h1 { margin: 0; font-weight: 500; font-size: 26px; letter-spacing: 0.01em; }
  header .sub { font-size: 14px; font-style: italic; opacity: 0.7; }
  header .right { margin-left: auto; display: flex; gap: 22px; align-items: baseline; font: 13px "IBM Plex Mono", monospace; }
  header .right a { color: #efe6cf; opacity: 0.75; text-decoration: underline; }
  .wrap { display: grid; grid-template-columns: 172px 1fr; height: calc(100% - 52px); }
  nav { padding: 18px 0 0 22px; border-right: 1px solid var(--rule); font-size: 17px; }
  nav a { display: block; color: var(--link); text-decoration: none; padding: 3px 0; }
  nav a.on { color: var(--ink); font-weight: 600; }
  nav a.on::before { content: ''; display: inline-block; width: 4px; height: 13px; background: var(--navy); margin: 0 7px 0 -11px; }
  nav .gap { height: 12px; }
  main { padding: 18px 26px; overflow: hidden; }
  .crumbs { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .crumbs a { color: var(--link); }
  h2 { margin: 0 0 2px; font-weight: 500; font-size: 30px; }
  .lede { margin: 0 0 16px; color: var(--muted); font-size: 17px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 18px; }
  .card { background: #fbf8f0; border: 1px solid var(--rule); }
  .card canvas { display: block; width: 100%; height: 118px; background: linear-gradient(180deg, #cfdadf, var(--pic)); }
  .card .t { display: flex; align-items: baseline; padding: 7px 10px 0; }
  .card .t b { font-weight: 500; font-size: 19px; color: var(--link); }
  .card .t span { margin-left: auto; font: 14px "IBM Plex Mono", monospace; }
  .card .tag { padding: 1px 10px 8px; font-size: 14px; color: var(--muted); font-style: italic; min-height: 26px; }
  .card .tag.own { font-style: normal; font: 11px "IBM Plex Mono", monospace; letter-spacing: 0.06em; color: var(--good); text-transform: uppercase; padding-top: 4px; }
  /* one item */
  .item { display: grid; grid-template-columns: 1.05fr 1fr; gap: 26px; }
  .item canvas { width: 100%; aspect-ratio: 16 / 10.5; background: linear-gradient(180deg, #cfdadf, var(--pic)); border: 1px solid var(--rule); display: block; }
  .item h2 { font-size: 32px; }
  .price { font: 20px "IBM Plex Mono", monospace; margin: 2px 0 12px; }
  .say { font-size: 19px; margin: 0 0 14px; }
  .gf { margin: 0 0 14px; font-size: 17px; line-height: 1.45; }
  .gf div::before { display: inline-block; width: 70px; font: 11px "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  .gf .g::before { content: 'Good for'; color: var(--good); }
  .gf .b::before { content: 'Not for'; color: var(--bad); }
  .vs { border-top: 1px solid var(--rule); padding-top: 9px; margin-bottom: 16px; }
  .vs h3 { margin: 0 0 6px; font: 11px "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  .vs .row { display: grid; grid-template-columns: 92px 1fr; font-size: 17px; padding: 2px 0; }
  .vs .row span:first-child { color: var(--muted); }
  .up { color: var(--good); } .down { color: var(--bad); }
  .buy { display: flex; gap: 16px; align-items: center; }
  .btn { font: 500 17px "EB Garamond", serif; padding: 7px 22px; background: linear-gradient(180deg, #34506e, var(--navy)); color: #f3ead2; border: 1px solid #142030; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); }
  .save { color: var(--link); font-size: 16px; text-decoration: underline; }
  /* home */
  .saving { display: flex; align-items: center; gap: 16px; padding: 12px 14px; background: #fbf8f0; border: 1px solid var(--rule); margin-bottom: 20px; }
  .saving canvas { width: 120px; height: 64px; background: var(--pic); }
  .saving .bar { height: 8px; background: #e2dacb; margin-top: 6px; width: 320px; }
  .saving .bar i { display: block; height: 100%; width: 38%; background: var(--navy); }
  .saving small { font: 13px "IBM Plex Mono", monospace; color: var(--muted); }
  h4 { margin: 0 0 10px; font-weight: 500; font-size: 20px; }
  .note { position: fixed; left: 12px; bottom: 8px; font: 12px "IBM Plex Mono", monospace; color: #c8b48a; opacity: 0.6; }
</style>
</head>
<body>
<div class="bezel"><div class="glass">
  <header><h1>Bayside Marine Supply</h1><span class="sub">Harbour Road · since 1974</span>
    <div class="right"><span>Cash $1,240.50</span><a>Log off</a></div></header>
  <div class="wrap">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div></div>
<script type="module">
import { toolIcon } from '../js/tools_draw.js';
import { drawEarl } from '../js/earl_draw.js';

const CATS = ['Home', '', 'Hand nets', 'Slurp guns', 'Tag guns', 'Cameras', 'Trawl nets', 'Traps', '', 'Suits', 'Fins', 'Air', 'Bags', '', 'Supplies'];
const NETS = [
  { n: 'Hand net', p: 'Free', tag: 'In your locker', own: true, pic: ['net', 0] },
  { n: 'Aquarium dip net', p: '$35', tag: 'Gentle', pic: ['net', 1] },
  { n: 'Bait-ball net', p: '$120', tag: 'Three at once', pic: ['net', 1] },
  { n: 'Long-handle net', p: '$260', tag: 'Long reach', pic: ['net', 2] },
  { n: 'Coarse game net', p: '$900', tag: 'Big fish', pic: ['net', 3] },
];
const page = location.search.slice(1) || location.hash.slice(1) || 'cat';
const on = page === 'home' ? 'Home' : 'Hand nets';
document.getElementById('nav').innerHTML = CATS.map((c) => c ? `<a class="${c === on ? 'on' : ''}">${c}</a>` : '<div class="gap"></div>').join('');
const card = (it, i) => `<div class="card"><canvas data-pic="${it.pic.join(',')}"></canvas><div class="t"><b>${it.n}</b><span>${it.p}</span></div><div class="tag ${it.own ? 'own' : ''}">${it.tag}</div></div>`;
const main = document.getElementById('main');
if (page === 'cat') {
  main.innerHTML = `<h2>Hand nets</h2><p class="lede">Key 1 under water. You carry one; swap them in the dive locker on deck.</p><div class="grid">${NETS.map(card).join('')}</div>`;
} else if (page === 'item') {
  main.innerHTML = `<div class="crumbs"><a>Hand nets</a> ›</div><div class="item"><canvas data-pic="net,2" data-big="1"></canvas><div>
    <h2>Long-handle net</h2><div class="price">$260</div>
    <p class="say">A telescopic pole and a deep bag.</p>
    <div class="gf"><div class="g">Reaching a fish before it bolts</div><div class="b">Quick fish up close: it swings slowly</div></div>
    <div class="vs"><h3>Against your hand net</h3>
      <div class="row"><span>Reach</span><span>1.2 m → 2.4 m <b class="up">▲</b></span></div>
      <div class="row"><span>Fish size</span><span>2–45 cm → 2–60 cm <b class="up">▲</b></span></div>
      <div class="row"><span>Swing</span><span>quick → slow <b class="down">▼</b></span></div></div>
    <div class="buy"><button class="btn">Buy · $260</button><a class="save">Save for this</a></div></div></div>`;
} else {
  main.innerHTML = `<div class="saving"><canvas data-pic="net,3"></canvas><div><small>SAVING FOR</small><div style="font-size:20px">Coarse game net</div><div class="bar"><i></i></div></div><div style="margin-left:auto;font:15px 'IBM Plex Mono',monospace">$340 of $900</div></div>
    <h4>New in</h4><div class="grid">${card({ n: 'Shrimp sipper', p: '$300', tag: 'Tiny animals', pic: ['slurp', 0] })}${card({ n: 'Macro camera', p: '$400', tag: 'Small animals pay more', pic: ['cam', 1] })}${card({ n: 'Crab pot', p: '$400', tag: 'Crabs and lobsters', pic: ['trap', 1] })}</div>`;
}
// the pictures: the game's own drawings of each thing
await document.fonts.ready;
for (const cv of document.querySelectorAll('canvas[data-pic]')) {
  const [kind, tier] = cv.dataset.pic.split(','), r = cv.getBoundingClientRect(), dpr = 2;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
  const ic = toolIcon(kind, +tier, Math.round(w * 0.8), Math.round(h * 0.8));
  ctx.drawImage(ic, w * 0.1, h * 0.1);
}
document.body.dataset.ready = '1';
</script>
<div class="note">mockup · not in the game</div>
</body>
</html>
