<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- A console panel face (nine-slice: 22 px corners): black enamel on a steel sheet, a lit top lip, a dark
       bottom lip, held by a screw in each corner (the corners never stretch, so the screws stay round). -->
