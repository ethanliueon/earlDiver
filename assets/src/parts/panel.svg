  <rect x="2" y="2" width="92" height="92" rx="8" fill="#141718" stroke="#010202" stroke-width="1.5"/>
  <path d="M10 3.4 H86" stroke="#fff" stroke-opacity="0.12" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M3.5 12 V84" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M10 92.6 H86" stroke="#000" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round"/>
  <use href="#s" x="6" y="6"/><use href="#s" x="80" y="6"/><use href="#s" x="6" y="80"/><use href="#s" x="80" y="80"/>
</svg>
